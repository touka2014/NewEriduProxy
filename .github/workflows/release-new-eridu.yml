name: Release New Eridu Proxy

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release-windows-x64:
    name: Build and publish Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate version and release notes
        id: metadata
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw "v2rayN/Directory.Build.props"
          $metadata = $props.Project.PropertyGroup | Where-Object { $_.VersionPrefix }
          $version = [string]$metadata.VersionPrefix
          if ($metadata.VersionSuffix) { $version += "-$($metadata.VersionSuffix)" }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and product version do not match." }
          $notes = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Release notes are missing: $notes" }
          "title=New Eridu Proxy $env:GITHUB_REF_NAME — $($metadata.ReleaseCodename)" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Prepare verified runtime cores
        shell: pwsh
        run: ./scripts/prepare-cores.ps1

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore v2rayN/v2rayN.sln

      - name: Build release
        shell: pwsh
        run: dotnet build v2rayN/v2rayN.sln --no-restore -c Release

      - name: Run tests
        shell: pwsh
        run: ./v2rayN/ServiceLib.Tests/bin/Release/net10.0/ServiceLib.Tests.exe --no-ansi --progress off --output Normal

      - name: Verify parallel core operation
        shell: pwsh
        run: dotnet run --project v2rayN/ServiceLib.RuntimeTests/ServiceLib.RuntimeTests.csproj -c Release

      - name: Publish application
        shell: pwsh
        run: >-
          dotnet publish v2rayN/v2rayN/v2rayN.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o dist/NewEriduProxy-windows-x64

      - name: Publish upgrade helper
        shell: pwsh
        run: >-
          dotnet publish v2rayN/AmazTool/AmazTool.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o dist/NewEriduProxy-windows-x64

      - name: Verify clean package
        shell: pwsh
        run: |
          $stage = Resolve-Path "dist/NewEriduProxy-windows-x64"
          $required = @(
            "NewEriduProxy.exe",
            "AmazTool.exe",
            "bin/Xray/xray.exe",
            "bin/sing_box/sing-box.exe"
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $relativePath))) {
              throw "Required release file is missing: $relativePath"
            }
          }
          foreach ($runtimeDirectory in @("guiConfigs", "guiLogs", "guiTemps", "binConfigs")) {
            if (Test-Path -LiteralPath (Join-Path $stage $runtimeDirectory)) {
              throw "Runtime user data must not be included: $runtimeDirectory"
            }
          }

      - name: Package release
        shell: pwsh
        run: |
          $archive = "dist/NewEriduProxy-windows-x64.zip"
          Compress-Archive -LiteralPath "dist/NewEriduProxy-windows-x64" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NewEriduProxy-windows-x64.zip" | Set-Content -LiteralPath "$archive.sha256" -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NewEriduProxy-windows-x64
          path: |
            dist/NewEriduProxy-windows-x64.zip
            dist/NewEriduProxy-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.metadata.outputs.title }}
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          make_latest: false
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/NewEriduProxy-windows-x64.zip
            dist/NewEriduProxy-windows-x64.zip.sha256
